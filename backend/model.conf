# ============================================================
# Casbin 模型（model.conf）—— 本示例的「权限规则语法」
# PERM 四要素：Request(请求) / Policy(策略) / Effect(效果) / Matcher(匹配器)
# ============================================================

# 请求定义：每次鉴权传入的参数（中间件里 e.Enforce(...) 的实参顺序必须与此一致）
# 四元组：谁(sub) 在哪个租户(dom) 对什么资源(obj) 做什么操作(act)
[request_definition]
r = sub, dom, obj, act

# 策略定义：policy.csv（或数据库 casbin_rule 表）里每条 p 规则的字段含义
[policy_definition]
p = sub, dom, obj, act

# 角色定义：三元的 g 表示「用户在某个域里拥有某个角色」—— 带域的 RBAC
# 例如 g, alice, admin, tenant-a 表示 alice 是 tenant-a 的管理员
[role_definition]
g = _, _, _

# 策略效果：命中任意一条策略即放行。
# 注意：Casbin 的 effect 只支持几种固定模板（allow-override / deny-override /
# priority 等），不能写任意表达式；所以「属主放行」这条 ABAC 规则
# 放在了下面的匹配器里 —— 这也是官方 ABAC 示例的标准写法。
[policy_effect]
e = some(where (p.eft == allow))

# 匹配器：请求与某条策略满足以下「任一」分支即放行。
#
# 分支① 常规 RBAC：
#   主体相等（或经 g 展开角色继承后相等）&& 域相同
#   && 资源名匹配（或策略为 *）&& 操作匹配（或策略为 *）
#
# 分支② ABAC 属主放行（占位主体 "owner"）：
#   policy.csv 里有两条占位规则「p, owner, tenant-x, *, *」。
#   只要请求者是资源属主（r.obj.Owner == r.sub），该分支即命中 ——
#   无角色也能读写删自己的资源；反过来，别人的资源这条分支永远不命中。
#   r.obj 是结构体（见 casbinx/object.go），能取属性就是 ABAC 的体现。
#   注意「owner」是保留主体名：策略管理接口会拒绝把它当角色或主体使用。
[matchers]
m = ((r.sub == p.sub || g(r.sub, p.sub, r.dom)) && r.dom == p.dom && (r.obj.Name == p.obj || p.obj == "*") && (r.act == p.act || p.act == "*")) || (p.sub == "owner" && r.dom == p.dom && r.obj.Owner == r.sub)
